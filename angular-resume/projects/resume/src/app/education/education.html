<section>
  <h2>{{ i18n.t('education') }}</h2>
  <p class="uni"><b>{{ i18n.t('university') }}</b></p>
  <p class="spec">{{ i18n.t('specialty') }}</p>

  <div class="groups">
    @for (g of groups; track $index) {
      <div class="group">
        <h3>{{ i18n.pick(g.title) }}</h3>
        <div class="tags">
          @for (item of g.items; track $index) {
            <span class="tag">{{ i18n.pick(item) }}</span>
          }
        </div>
      </div>
    }
  </div>
</section>
