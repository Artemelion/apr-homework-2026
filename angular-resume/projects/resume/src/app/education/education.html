<section>
  <h2>{{ i18n.t('education') }}</h2>
  <p class="uni"><b>{{ i18n.t('university') }}</b></p>
  <p class="spec">{{ i18n.t('specialty') }}</p>
  <p class="spec">{{ years }}</p>
</section>

<section class="certs">
  <h2>{{ i18n.t('certificates') }}</h2>
  <ul>
    @for (c of visible; track c.name) {
      <li>
        <b>{{ c.name }}</b>
        <span class="issuer">{{ c.issuer }}</span>
      </li>
    }
  </ul>

  <div class="more" [ngClass]="{ open: showAll }" (click)="showAll = !showAll">
    <span>{{ showAll ? i18n.t('showLess') : i18n.t('showAll') + ' (' + certificates.length + ')' }}</span>
    <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9" /></svg>
  </div>
</section>
