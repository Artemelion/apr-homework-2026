<svg viewBox="0 0 140 230" class="bot">
  <!-- тень под роботом -->
  <ellipse class="shadow" cx="70" cy="218" rx="34" ry="6" />

  <g class="body">
    <!-- антенна -->
    <line x1="70" y1="34" x2="70" y2="16" class="stroke" />
    <circle cx="70" cy="12" r="6" class="light" />

    <!-- голова -->
    <rect x="26" y="34" width="88" height="66" rx="22" class="shell" />
    <rect x="36" y="46" width="68" height="42" rx="14" class="screen" />

    <!-- глаза: моргают и смотрят на курсор -->
    <g class="eyes" [attr.transform]="'translate(' + eyeX + ' ' + eyeY + ')'">
      <rect x="49" y="58" width="11" height="15" rx="5.5" class="eye" />
      <rect x="80" y="58" width="11" height="15" rx="5.5" class="eye" />
    </g>
    <path d="M60 80 Q70 86 80 80" class="smile" />

    <!-- уши -->
    <rect x="18" y="56" width="10" height="22" rx="5" class="shell" />
    <rect x="112" y="56" width="10" height="22" rx="5" class="shell" />

    <!-- шея и туловище -->
    <rect x="62" y="100" width="16" height="10" rx="3" class="shell" />
    <rect x="34" y="110" width="72" height="66" rx="18" class="shell" />
    <rect x="48" y="124" width="44" height="26" rx="8" class="screen" />
    <circle cx="58" cy="137" r="4" class="dot d1" />
    <circle cx="70" cy="137" r="4" class="dot d2" />
    <circle cx="82" cy="137" r="4" class="dot d3" />
    <rect x="52" y="158" width="36" height="6" rx="3" class="bar" />

    <!-- руки: одна машет -->
    <g class="arm arm-left">
      <rect x="14" y="116" width="16" height="44" rx="8" class="shell" />
      <circle cx="22" cy="164" r="7" class="shell" />
    </g>
    <g class="arm arm-wave">
      <rect x="110" y="116" width="16" height="44" rx="8" class="shell" />
      <circle cx="118" cy="164" r="7" class="shell" />
    </g>

    <!-- ноги-колёсики -->
    <rect x="46" y="176" width="16" height="22" rx="6" class="shell" />
    <rect x="78" y="176" width="16" height="22" rx="6" class="shell" />
  </g>
</svg>
