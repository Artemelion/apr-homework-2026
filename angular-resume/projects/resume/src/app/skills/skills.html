<section>
  <h2>{{ i18n.t('skills') }}</h2>

  <div class="groups">
    @for (g of groups; track $index) {
      <div>
        <h3>{{ i18n.pick(g.title) }}</h3>
        <div class="tags">
          @for (item of g.items; track item) {
            <span class="tag">{{ item }}</span>
          }
        </div>
      </div>
    }
  </div>
</section>
