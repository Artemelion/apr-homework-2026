<div class="page" [ngClass]="{ dark: darkTheme }">
  <!-- роботы по бокам, видно только на широком экране -->
  <app-robot side="left" />
  <app-robot side="right" />

  <div class="toolbar">
    <div class="langs">
      @for (l of langs; track l.code) {
        <button class="lang" [ngClass]="{ active: i18n.lang() === l.code }" (click)="i18n.setLang(l.code)">
          {{ l.title }}
        </button>
      }
    </div>

    <!-- солнышко в тёмной теме, луна в светлой -->
    <button class="theme" (click)="toggleTheme()" [title]="darkTheme ? i18n.t('toLight') : i18n.t('toDark')">
      {{ darkTheme ? '☀️' : '🌙' }}
    </button>
  </div>

  <div class="card" reveal>
    <app-profile />
  </div>

  <div class="card" reveal>
    <h2>{{ i18n.t('about') }}</h2>
    <p>{{ i18n.t('aboutText') }}</p>
  </div>

  <div class="card" reveal>
    <app-experience />
  </div>

  <div class="card" reveal>
    <app-skills />
  </div>

  <div class="card" reveal>
    <app-education />
  </div>

  <div class="card" reveal>
    <app-certificates />
  </div>

  <div class="card" reveal>
    <app-projects />
  </div>
</div>
