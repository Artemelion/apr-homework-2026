<section>
  <h2>{{ i18n.t('projects') }}</h2>
  <ul>
    @for (p of projects; track p.name) {
      <li>
        <a [href]="p.url" target="_blank"><b>{{ p.name }}</b> ↗</a>
        <span class="desc">{{ i18n.pick(p.description) }}</span>
        <span class="stack">{{ p.stack }}</span>
      </li>
    }
  </ul>
</section>
